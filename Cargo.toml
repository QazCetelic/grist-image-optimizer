[package]
name = "grist-image-optimizer"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.4", features = ["derive", "env"] }
grist-client = { git = "https://github.com/QazCetelic/grist-client-rs" }
tokio = { version = "1", features = ["full"] }
serde_json = "^1.0"
futures = "0.3.33"
anyhow = "1.0.104"
tempfile = "3.27.0"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"